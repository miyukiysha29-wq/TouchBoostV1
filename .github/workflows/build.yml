name: Build Touch Boost

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Generate project files
        run: |
          mkdir -p app/src/main/java/com/touchboost/lsposed
          mkdir -p app/src/main/assets

          cat > settings.gradle.kts <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositories {
                  google()
                  mavenCentral()
                  maven("https://api.xposed.info/")
              }
          }
          rootProject.name = "TouchBoost"
          include(":app")
          EOF

          cat > build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2g
          android.useAndroidX=true
          EOF

          cat > app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.touchboost.lsposed"
              compileSdk = 34

              defaultConfig {
                  applicationId = "com.touchboost.lsposed"
                  minSdk = 26
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_1_8
                  targetCompatibility = JavaVersion.VERSION_1_8
              }
              kotlinOptions {
                  jvmTarget = "1.8"
              }
          }

          dependencies {
              compileOnly("de.robv.android.xposed:api:82")
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:allowBackup="false"
                  android:label="Touch Boost">
                  <meta-data android:name="xposedmodule" android:value="true" />
                  <meta-data android:name="xposeddescription" android:value="Aggressive touch boost: binabawasan ang touch delay" />
                  <meta-data android:name="xposedminversion" android:value="82" />
              </application>
          </manifest>
          EOF

          echo "com.touchboost.lsposed.MainHook" > app/src/main/assets/xposed_init

          cat > app/src/main/java/com/touchboost/lsposed/MainHook.kt <<'EOF'
          package com.touchboost.lsposed

          import android.app.Activity
          import android.os.Process
          import android.view.MotionEvent
          import android.view.ViewConfiguration
          import de.robv.android.xposed.IXposedHookLoadPackage
          import de.robv.android.xposed.XC_MethodHook
          import de.robv.android.xposed.XC_MethodReplacement
          import de.robv.android.xposed.XposedBridge
          import de.robv.android.xposed.XposedHelpers
          import de.robv.android.xposed.callbacks.XC_LoadPackage

          class MainHook : IXposedHookLoadPackage {

              companion object {
                  // ---- I-edit dito kung gusto mong i-tune ----
                  const val SLOP_PERCENT = 60        // touch slop (100 = default, mas mababa = mas mabilis magsimula ang scroll)
                  const val FLING_MAX_PERCENT = 150  // max fling velocity
                  const val FLING_MIN_PERCENT = 50   // min fling velocity
                  const val TAP_TIMEOUT_MS = 50      // tap timeout (default ~100)
                  const val BOOST_THREAD_PRIORITY = -8 // URGENT_DISPLAY
              }

              override fun handleLoadPackage(lpparam: XC_LoadPackage.LoadPackageParam) {
                  // Iwas system_server para hindi mag-bootloop
                  if (lpparam.packageName == "android") return

                  safe("ViewConfiguration") { hookViewConfiguration() }
                  safe("TouchPriority") { hookTouchPriority() }
                  XposedBridge.log("TouchBoost: loaded sa " + lpparam.packageName)
              }

              private fun safe(name: String, block: () -> Unit) {
                  try {
                      block()
                  } catch (t: Throwable) {
                      XposedBridge.log("TouchBoost: $name failed: $t")
                  }
              }

              private fun hookViewConfiguration() {
                  val vc = ViewConfiguration::class.java

                  XposedHelpers.findAndHookMethod(vc, "getScaledTouchSlop", object : XC_MethodHook() {
                      override fun afterHookedMethod(param: MethodHookParam) {
                          val v = param.result as Int
                          param.result = maxOf(2, v * SLOP_PERCENT / 100)
                      }
                  })

                  XposedHelpers.findAndHookMethod(vc, "getScaledMaximumFlingVelocity", object : XC_MethodHook() {
                      override fun afterHookedMethod(param: MethodHookParam) {
                          val v = param.result as Int
                          param.result = v * FLING_MAX_PERCENT / 100
                      }
                  })

                  XposedHelpers.findAndHookMethod(vc, "getScaledMinimumFlingVelocity", object : XC_MethodHook() {
                      override fun afterHookedMethod(param: MethodHookParam) {
                          val v = param.result as Int
                          param.result = maxOf(1, v * FLING_MIN_PERCENT / 100)
                      }
                  })

                  XposedHelpers.findAndHookMethod(
                      vc, "getTapTimeout",
                      XC_MethodReplacement.returnConstant(TAP_TIMEOUT_MS)
                  )
              }

              private fun hookTouchPriority() {
                  XposedHelpers.findAndHookMethod(
                      Activity::class.java, "dispatchTouchEvent", MotionEvent::class.java,
                      object : XC_MethodHook() {
                          override fun beforeHookedMethod(param: MethodHookParam) {
                              val ev = param.args[0] as? MotionEvent ?: return
                              if (ev.actionMasked == MotionEvent.ACTION_DOWN) {
                                  try {
                                      Process.setThreadPriority(BOOST_THREAD_PRIORITY)
                                  } catch (ignored: Throwable) {
                                  }
                              }
                          }
                      }
                  )
              }
          }
          EOF

      - name: Build APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TouchBoost-APK
          path: app/build/outputs/apk/debug/*.apk
